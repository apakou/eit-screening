# Grille d'évaluation de la présélection.
#
# ATTENTION : ces quatre critères notés sur 10 viennent du mémoire, PAS du guide
# d'évaluation 2027 de MEST. Le guide note sur 40 points des domaines qu'il
# nomme lui-même, sans que leurs noms ni leur pondération aient encore été
# reportés ici. À remplacer par les domaines du guide, sans inventer de
# pondération (voir docs/cadrage.md). Modifier ce fichier, pas le code.
#
# « query » est la requête de recherche envoyée au dossier du candidat pour ce
# critère (en anglais, comme les dossiers).

total_points = 40

[[criteria]]
key = "resume_technical"
name = "Resume & Technical Experience"
max_points = 10
query = "Education, technical skills, programming languages, software projects built and professional work experience."

[[criteria]]
key = "entrepreneurial_vision"
name = "Entrepreneurial Motivation & Vision"
max_points = 10
query = "Why the candidate wants to become an entrepreneur, the product they want to build, the problem it solves and for whom."

[[criteria]]
key = "communication"
name = "Communication & Clarity"
max_points = 10
query = "Clear, specific and personal explanations with concrete facts, numbers and examples from the candidate's own experience."

[[criteria]]
key = "program_fit"
name = "Program Fit & Collaboration"
max_points = 10
query = "Teamwork, leadership, collaborating with others, resilience after setbacks and readiness for an intensive startup program."

# Concerns : les huit drapeaux du tableau de bord utilisé pour la revue des
# candidatures de la cohorte 2027, repris dans leur ordre et avec leur libellé
# exact. « detection » dit comment le prototype produit chaque drapeau :
#   controle : règle déterministe des étapes 1 et 2 (éligibilité, test) ;
#   modele   : jugement du modèle de langage, avec citation vérifiée ;
#   manuel   : aucune détection automatique ; l'évaluateur le coche lui-même.
# Ne pas inventer de détection pour un drapeau « manuel » : l'afficher comme
# détecté sans qu'aucun code ne le produise fausserait l'évaluation.

[[concerns]]
key = "incomplete_responses"
name = "Incomplete or very limited responses"
detection = "manuel"

[[concerns]]
key = "generic_ai_responses"
name = "Generic or potentially AI-generated responses"
detection = "modele"

[[concerns]]
key = "limited_technical_experience"
name = "Limited evidence of relevant technical experience"
detection = "manuel"

[[concerns]]
key = "video_concerns"
name = "Video concerns"
detection = "manuel"

[[concerns]]
key = "assessment_concerns"
name = "Assessment concerns"
detection = "controle"

[[concerns]]
key = "assessment_late_submission"
name = "Assessment submitted after deadline"
detection = "controle"

[[concerns]]
key = "assessment_not_found"
name = "Assessment not found"
detection = "controle"

[[concerns]]
key = "other_concern"
name = "Other? Please include in Review Comments"
detection = "manuel"
