# Paramètres du découpage et de l'indexation des passages anonymisés.

[chunking]
# Taille visée d'un passage, en mots. Un texte plus court reste en un seul passage.
max_words = 120
# Recouvrement entre deux passages consécutifs d'un même texte, en mots.
overlap_words = 20
# Sections indexées. Les noms de fichiers (« uploads ») ne le sont pas.
sections = ["essay", "personal_statement", "assessment_reflection", "attachment", "education", "experience"]

[embedding]
# BAAI/bge-m3 (licence MIT) : vecteur dense et poids lexicaux (vecteur creux).
model = "BAAI/bge-m3"
# Révision figée du dépôt Hugging Face, pour des résultats reproductibles.
revision = "5617a9f61b028005a4858fdac845db406aefb181"
max_tokens = 512
batch_size = 8

[qdrant]
# Adresse d'un serveur Qdrant (Docker Compose). Vide : base locale dans le
# dossier « path », sans serveur.
url = ""
path = "data/qdrant-local"
collection = "passages"

[retrieval]
# Chaîne utilisée pour le verdict : dense, sparse, hybrid ou hybrid_rerank.
# Décision du 22 novembre 2026, sur la mesure de l'étape 6 (eit-search-eval) :
# la recherche dense seule place le bon passage dans les 3 premiers pour 94,9 %
# des questions, contre 90,9 % pour l'hybride et 86,6 % avec re-ranking.
# Le cadrage prévoyait hybrid_rerank : remettre cette valeur pour y revenir.
mode = "dense"
# Candidats pris dans chaque recherche (dense, lexicale) avant la fusion RRF.
prefetch_limit = 20
# Candidats après fusion, transmis au re-ranking.
candidates = 10
# Passages gardés par requête au bout de la chaîne.
top_k = 3

[reranking]
# BAAI/bge-reranker-v2-m3 (licence Apache-2.0), en pleine précision : la
# demi-précision est plus lente sur processeur.
enabled = true
model = "BAAI/bge-reranker-v2-m3"
revision = "953dc6f6f85a1b2dbfca4c34a2796e7dde08d41e"
max_tokens = 512
batch_size = 8
