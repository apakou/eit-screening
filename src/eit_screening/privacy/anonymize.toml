# Paramètres de l'anonymisation du texte destiné au modèle de langage.

[labels]
# Marques qui remplacent les données masquées. {n} numérote les tiers d'un dossier.
candidate = "[CANDIDAT]"
person = "[PERSONNE_{n}]"
email = "[EMAIL]"
phone = "[TÉLÉPHONE]"
url = "[LIEN]"

[places]
# Masquage des lieux : pays, villes et nationalités sont remplacés par une marque,
# pour que le modèle ne puisse pas déduire la nationalité du candidat.
# Le modèle voit toujours qu'un lieu précis est cité.
enabled = true
country_label = "[PAYS]"
city_label = "[VILLE]"
nationality_label = "[NATIONALITÉ]"
# Lieu repéré par la reconnaissance d'entités, sans savoir s'il s'agit d'un pays ou d'une ville.
place_label = "[LIEU]"
# Langues locales : elles désignent un pays aussi sûrement qu'une ville.
# L'anglais et le français ne sont pas masqués.
language_label = "[LANGUE]"
# Garder intacts les noms d'établissements et d'employeurs déclarés dans le
# dossier, même s'ils contiennent un lieu (« University of Ghana »). Ils
# renseignent le critère « CV et expérience » ; en contrepartie, ils laissent
# souvent deviner le pays.
keep_organisations = true
# Lieux que la reconnaissance d'entités ne doit pas masquer : ils ne disent rien
# de la nationalité du candidat.
allow_list = ["Africa", "West Africa", "East Africa", "Sub-Saharan Africa", "Afrique", "Afrique de l'Ouest", "Sahel", "Europe"]

# Comparaison sans casse ni accents : « Senegal » couvre « Sénégal ».
