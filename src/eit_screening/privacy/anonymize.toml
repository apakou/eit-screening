[ner]
# Dernière couche : repérage des noms de personnes inconnus du dossier
# (personnes citées dans le CV ou les réponses) par Presidio et spaCy.
enabled = true
language = "en"
# Modèle installé par pyproject.toml (en_core_web_md 3.8.0, licence MIT).
model = "en_core_web_md"
min_score = 0.6
# Mots que le modèle prend parfois pour des noms de personnes et qui n'en sont
# pas. Comparaison sans casse. Un nom réel ajouté ici ne serait plus masqué.
# Un passage qui contient l'un de ces mots est gardé.
allow_list = [
    "Django", "Flask", "FastAPI", "React", "Native", "Node", "Java", "Kotlin",
    "Flutter", "Laravel", "Figma", "Canva", "Tableau", "Excel", "Power BI",
    "Firebase", "Jupyter", "Hackathon", "Finalist", "University", "Université",
    "Resume", "CV", "Certificate", "Evidence",
]

[noisy]
# Texte issu de l'OCR (certificats scannés) ou de la reconnaissance vocale : un
# nom peut y être mal lu (« Mensa » pour « Mensah »). Un mot qui ressemble à un
# mot de nom du dossier au-dessus de ce seuil (0 à 100) est masqué. Les mots plus
# courts que min_length ne sont comparés qu'à l'identique.
name_threshold = 85
min_length = 4
# Même comparaison pour les pays et villes d'un seul mot, à partir de 5 lettres
# pour épargner les mots anglais courts. Nationalités et langues n'y passent
# pas : trop proches de mots courants (« librarian » et « Liberian »).
place_min_length = 5

[table]
# Table de correspondance numéro de dossier -> pseudonyme. Elle doit rester
# hors du dépôt et hors du dossier de sortie. « ~ » désigne le dossier personnel.
default_path = "~/.local/share/eit-screening/pseudonymes.json"
