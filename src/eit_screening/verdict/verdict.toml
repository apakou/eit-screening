# Paramètres du verdict proposé.

[llm]
# Serveur compatible OpenAI. Par défaut, Ollama sur la machine locale : aucun
# texte ne quitte la machine. Pour un modèle hébergé (cible du cadrage : Gemma
# ou Qwen), changer base_url et model, et mettre la clé dans la variable
# d'environnement nommée par api_key_env. Seul du texte anonymisé est envoyé.
base_url = "http://127.0.0.1:11434/v1"
# Substitut local, déjà présent sur la machine de développement (Llama 3.2, 3B).
model = "llama3.2:latest"
api_key_env = "EIT_LLM_API_KEY"
temperature = 0.0
max_tokens = 1200
timeout_seconds = 600
# Nouvelles tentatives si la réponse n'est pas conforme au schéma.
max_attempts = 3

[retrieval]
# Passages fournis au modèle pour chaque critère de la grille.
passages_per_criterion = 3

[decision]
# Guide 2027 : la décision prend trois valeurs (Interview Invitation,
# Interview Reject, Waitlist) et un booléen distinct, request_further_review.
# Règle explicite entre notes, constats et décision proposée ; l'évaluateur
# valide ou modifie toujours.
#
# Seuils : HYPOTHÈSES, le guide ne donne pas de seuil.
invite_min = 28          # total sur 40 à partir duquel l'entretien est proposé
waitlist_min = 20        # en dessous : Interview Reject
# Constats qui écartent la candidature selon le guide (« écarté ») : la décision
# proposée est Interview Reject. Seuls les constats de gravité « alerte » de ces
# codes comptent (un cas « à vérifier », comme une double nationalité, n'écarte pas).
exclusion_codes = ["age_out_of_range", "citizenship_outside_region", "graduation_after_cutoff"]
# request_further_review vaut vrai si l'un de ces cas se présente :
review_on_findings = true          # tout autre constat (signalé par le guide ou par les contrôles)
review_on_concerns = true          # un Concern (test, réponses génériques)
max_unverified_quotes = 0          # plus de citations introuvables que ce nombre
