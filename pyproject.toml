[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eit-screening"
version = "0.1.0"
description = "Prototype RAG d'aide à la présélection des candidatures du MEST AI Startup Program"
requires-python = ">=3.11"
dependencies = [
    "pdfplumber>=0.11",
    "pydantic>=2.6",
    "reportlab>=4.0",
    "pillow>=10.1",
    "rapidfuzz>=3.6",
    "presidio-analyzer>=2.2",
    "spacy>=3.8,<3.9",
    # Modèle spaCy pour la reconnaissance des noms (licence MIT, environ 55 Mo).
    "en_core_web_md @ https://github.com/explosion/spacy-models/releases/download/en_core_web_md-3.8.0/en_core_web_md-3.8.0-py3-none-any.whl",
    # Pièces jointes et vidéos. Installer PyTorch en version processeur :
    # pip install -e ".[dev]" --extra-index-url https://download.pytorch.org/whl/cpu
    "docling>=2.150",
    "faster-whisper>=1.2",
    "numpy>=2",
    # Indexation : bge-m3 (transformers, torch) et Qdrant.
    "qdrant-client>=1.15",
    "huggingface-hub>=0.24",
    "transformers>=4.44",
    "torch>=2.4",
    # Client du modèle de langage (protocole compatible OpenAI).
    "httpx>=0.27",
    # API et base de données.
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
eit-import = "eit_screening.ingestion.smapply_pdf:main"
eit-generate = "eit_screening.synthetic.generate:main"
eit-eligibility = "eit_screening.screening.eligibility:main"
eit-assessment = "eit_screening.screening.assessment_match:main"
eit-anonymize = "eit_screening.privacy.anonymize:main"
eit-leak-check = "eit_screening.privacy.leak_check:main"
eit-media = "eit_screening.media.extract:main"
eit-index = "eit_screening.search.index:main"
eit-search = "eit_screening.search.evaluate:main_criteria"
eit-search-eval = "eit_screening.search.evaluate:main"
eit-verdict = "eit_screening.verdict.run:main"
eit-api = "eit_screening.api.app:main"
eit-api-load = "eit_screening.api.load:main"
eit-evaluate = "eit_screening.evaluation.report:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
eit_screening = ["grille.toml", "synthetic/*.json", "screening/*.toml", "privacy/*.toml", "media/*.toml", "search/*.toml", "verdict/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
